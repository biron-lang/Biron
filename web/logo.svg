<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 20 94 60" fill="none" stroke="#ffc815" stroke-width="4" stroke-linecap="round" role="img" aria-label="Biron">
  <!-- Left edge: 5 vertical bars, the smallest a circle at the top-left corner -->
  <circle cx="7.5" cy="24.5" r="2" fill="#ffc815" stroke="none"/>
  <line x1="16"   y1="24.5" x2="16"   y2="34.7"/>
  <line x1="24.5" y1="24.5" x2="24.5" y2="44.9"/>
  <line x1="33"   y1="24.5" x2="33"   y2="55.1"/>
  <line x1="41.5" y1="24.5" x2="41.5" y2="65.3"/>
  <!-- Right edge: 7 horizontal bars, top one level with the bar tops, tapering to a circle at the tip -->
  <line x1="50" y1="24.5" x2="92.5" y2="24.5"/>
  <line x1="50" y1="33"   x2="85.4" y2="33"/>
  <line x1="50" y1="41.5" x2="78.3" y2="41.5"/>
  <line x1="50" y1="50"   x2="71.3" y2="50"/>
  <line x1="50" y1="58.5" x2="64.2" y2="58.5"/>
  <line x1="50" y1="67"   x2="57.1" y2="67"/>
  <circle cx="50" cy="75.5" r="2" fill="#ffc815" stroke="none"/>
</svg>
